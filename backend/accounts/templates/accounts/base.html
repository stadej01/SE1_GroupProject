<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dialogue editor{% endblock %}</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #202c39; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 15px; line-height: 1.5; }
    a { color: #245c9a; text-underline-offset: 3px; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px max(24px, calc((100vw - 1040px) / 2)); background: #fff; border-bottom: 1px solid #dfe5eb; }
    .brand { color: inherit; font-size: 18px; font-weight: 650; text-decoration: none; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; }
    main { max-width: 1040px; margin: 40px auto; padding: 0 24px; }
    h1 { font-size: 26px; margin: 0 0 24px; }
    h2 { font-size: 19px; margin: 0 0 16px; }
    .auth-panel { max-width: 480px; margin: 0 auto; }
    .panel { background: #fff; border: 1px solid #dfe5eb; border-radius: 8px; padding: 24px; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; gap: 24px; }
    .team + .team { margin-top: 28px; }
    .projects { list-style: none; padding: 0; margin: 0; }
    .projects li { padding: 12px 0; border-bottom: 1px solid #e4e9ef; }
    .projects a, h2 { overflow-wrap: anywhere; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input, select { width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; border: 1px solid #aebdc9; border-radius: 6px; background: #fff; color: inherit; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid #d6dfe7; border-radius: 6px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #edf2f7; }
    .primary { background: #245c9a; color: #fff; border-color: #245c9a; }
    .primary:hover { background: #194b83; }
    :focus-visible { outline: 3px solid #245c9a; outline-offset: 3px; }
    .helptext { display: block; color: #536579; font-size: 13px; margin-top: 6px; }
    form ul { padding-left: 20px; font-size: 13px; }
    .errorlist { color: #a12636; }
    .team-field { margin: 1em 0; }
    .team-field input[aria-invalid="true"] { border-color: #a12636; }
    .team-field .errorlist { margin: 6px 0 0; padding: 0; list-style: none; }
    .muted { color: #536579; }
    .side-panels { display: grid; gap: 24px; }
    .team { scroll-margin-top: 24px; border-radius: 6px; }
    .team:target { outline: 2px solid #9fc1e8; outline-offset: 8px; }
    .team-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .team-header h2 { min-width: 0; margin: 0; }
    .team-link { flex: none; font-size: 14px; }
    .messages { margin: 0 0 20px; }
    .message, .error-banner { margin: 0 0 8px; padding: 10px 14px; border-radius: 6px; border: 1px solid #b9d7c3; background: #eef8f1; color: #1f5b33; overflow-wrap: anywhere; }
    .error-banner { border-color: #ebc8c3; background: #fff8f7; color: #a12636; }
    .back-link { display: inline-block; margin-bottom: 12px; }
    .page-title { overflow-wrap: anywhere; }
    .members { list-style: none; padding: 0; margin: 0; }
    .members li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e4e9ef; }
    .member { display: grid; min-width: 0; }
    .member-name { font-weight: 600; overflow-wrap: anywhere; }
    .member-email { color: #536579; font-size: 14px; overflow-wrap: anywhere; }
    .you { margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: #e8f1fb; color: #1d4f86; font-size: 12px; font-weight: 600; }
    .member-action { display: grid; justify-items: end; gap: 4px; flex: none; max-width: 50%; text-align: right; }
    .member-action .muted { font-size: 13px; }
    .danger { color: #a12636; border-color: #e7aab2; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button:disabled:hover { background: #fff; }
    .primary:disabled:hover { background: #245c9a; }
    .danger-primary:disabled:hover { background: #a12636; }
    .confirm-dialog { width: min(460px, calc(100vw - 32px)); padding: 24px; color: inherit; border: 1px solid #d6dfe7; border-radius: 10px; box-shadow: 0 18px 50px #0003; }
    .confirm-dialog::backdrop { background: #1b263366; }
    .confirm-dialog h2, .confirm-dialog p { overflow-wrap: anywhere; }
    .confirm-dialog p { color: #3d4f62; }
    .dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .danger-primary { background: #a12636; border-color: #a12636; color: #fff; }
    .danger-primary:hover { background: #861d2c; }
    @media (max-width: 700px) {
      .site-header { padding: 16px 20px; flex-wrap: wrap; }
      main { margin: 24px auto; padding: 0 20px; }
      .home-grid { grid-template-columns: 1fr; }
      .members li { flex-wrap: wrap; }
      .member-action { max-width: none; justify-items: start; text-align: left; }
      .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'pages:home' %}">Dialogue editor</a>
    {% if user.is_authenticated %}
    <nav aria-label="Account navigation">
      <span>{{ user.display_name }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if messages %}<div class="messages" role="status">{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
